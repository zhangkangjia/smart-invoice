services:

  # ========== PostgreSQL ==========
  postgres:
    image: postgres:16-alpine
    container_name: si-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartinvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartinvoice123}
      POSTGRES_DB: ${POSTGRES_DB:-smart_invoice}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - si-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartinvoice} -d ${POSTGRES_DB:-smart_invoice}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: si-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ========== RabbitMQ ==========
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: si-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-smartinvoice}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-smartinvoice123}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "status"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s

  # ========== MinIO ==========
  minio:
    image: minio/minio:latest
    container_name: si-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartinvoice}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartinvoice123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - si-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  # ========== MinIO 初始化（创建bucket） ==========
  minio-init:
    image: minio/mc:latest
    container_name: si-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-smartinvoice} ${MINIO_ROOT_PASSWORD:-smartinvoice123} &&
      mc mb local/smart-invoice --ignore-existing &&
      mc anonymous set download local/smart-invoice &&
      echo 'MinIO bucket created' &&
      exit 0
      "
    restart: "no"

  # ========== 后端 ==========
  backend:
    image: python:3.12-slim
    container_name: si-backend
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "pip install -i https://mirrors.cloud.tencent.com/pypi/simple/ -r /app/requirements.txt 2>&1 | tail -3 && python -m app.db.init_db && python -m app.db.seed_demo && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartinvoice}:${POSTGRES_PASSWORD:-smartinvoice123}@postgres:5432/${POSTGRES_DB:-smart_invoice}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-smartinvoice}:${POSTGRES_PASSWORD:-smartinvoice123}@postgres:5432/${POSTGRES_DB:-smart_invoice}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-smartinvoice}:${RABBITMQ_PASSWORD:-smartinvoice123}@rabbitmq:5672//
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-smartinvoice}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-smartinvoice123}
      MINIO_BUCKET: smart-invoice
      MINIO_SECURE: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AI_USE_MOCK: "true"
      CORS_ORIGINS: '["*"]'
      # 百望云数电发票通道（沙箱配置，生产请修改 .env）
      BAIWANG_APP_KEY: ${BAIWANG_APP_KEY:-}
      BAIWANG_APP_SECRET: ${BAIWANG_APP_SECRET:-}
      BAIWANG_USER_SALT: ${BAIWANG_USER_SALT:-}
      BAIWANG_USERNAME: ${BAIWANG_USERNAME:-}
      BAIWANG_PASSWORD: ${BAIWANG_PASSWORD:-}
      BAIWANG_TAX_NO: ${BAIWANG_TAX_NO:-}
      BAIWANG_INVOICE_TERMINAL_CODE: ${BAIWANG_INVOICE_TERMINAL_CODE:-}
      BAIWANG_API_BASE_URL: ${BAIWANG_API_BASE_URL:-https://sandbox-openapi.baiwang.com/router/rest}
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: admin123456
      DEFAULT_ADMIN_EMAIL: admin@smart-invoice.local
      # 微信服务号（客户开票入口）
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_TOKEN: ${WECHAT_TOKEN:-}
      WECHAT_AES_KEY: ${WECHAT_AES_KEY:-}
      # 企业微信（内部通知）
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_SECRET: ${WECOM_SECRET:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ========== 前端（nginx 托管静态文件，省内存） ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: si-frontend:latest
    container_name: si-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  si-pg-data:
  si-minio-data:
